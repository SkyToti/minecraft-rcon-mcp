[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecraft-rcon-mcp"
version = "0.1.0"
description = "MCP server to operate a Minecraft server over RCON with an allowlist and human confirmation for dangerous commands"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minecraft-rcon-mcp = "minecraft_rcon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_rcon_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
